<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    {% for post in posts %}
    
        <div>
            <h1>
                <a href="{% url 'blog:post-detail' pk=post.id %}">{{post.title}}</a>
            </h1>
            <p>
                {{post.content}}
            </p>
        </div>
    {% endfor %}
</body>
</html>
